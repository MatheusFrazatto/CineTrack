<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navegação de volta e cabeçalho -->
    <header>
        <a href="index.html" class="link-voltar">&larr; Voltar</a>
        <h1>Adicionar filme</h1>
    </header>

    <!-- Formulário de cadastro -->
    <main class="pagina-adicionar">
        <form id="form-filme" action="#" method="POST">
            
            <!-- 1. Título -->
            <div>
                <label for="titulo"><strong>Título</strong></label>
                <input type="text" id="titulo" name="titulo" required>
            </div>

            <!-- 2. Ano -->
            <div>
                <label for="ano"><strong>Ano</strong></label>
                <input type="number" id="ano" name="ano" min="1888" max="2030" required>
            </div>

            <!-- 3. Gênero -->
            <div>
                <label for="genero"><strong>Gênero</strong></label>
                <input type="text" id="genero" name="genero" required>
            </div>

            <!-- 4. Pôster -->
            <div>
                <label for="poster"><strong>URL do pôster</strong></label>
                <input type="url" id="poster" name="poster">
            </div>

            <!-- 5. Status -->
            <div>
                <label for="status"><strong>Status</strong></label>
                <select id="status" name="status" required>
                    <option value="quero_assistir">Quero assistir</option>
                    <option value="assistindo">Assistindo</option>
                    <option value="assistido">Assistido</option>
                </select>
            </div>

            <!-- 6. Nota -->
            <div>
                <label for="nota"><strong>Nota (1 a 5)</strong></label>
                <input type="number" id="nota" name="nota" min="1" max="5">
            </div>

            <!-- 7. Comentário -->
            <div>
                <label for="comentario"><strong>Comentário</strong></label>
                <textarea id="comentario" name="comentario" rows="4"></textarea>
            </div>

            <!-- Ações -->
            <div class="form-acoes">
                <button type="button" class="btn-cancelar" onclick="history.back()">Cancelar</button>
                <button type="submit" class="btn-salvar">Salvar</button>
            </div>

        </form>
    </main>

</body>
</html>
