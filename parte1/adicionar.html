<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
</head>
<body>

    <!-- Navegação de volta e cabeçalho -->
    <header>
        <a href="index.html">&larr; Voltar</a>
        <h1>Adicionar filme</h1>
    </header>

    <!-- Formulário de cadastro -->
    <main>
        <form id="form-filme" action="#" method="POST">
            
            <!-- 1. Título -->
            <div>
                <label for="titulo">Título</label><br>
                <input type="text" id="titulo" name="titulo" required>
            </div>

            <!-- 2. Ano -->
            <div>
                <label for="ano">Ano</label><br>
                <input type="number" id="ano" name="ano" min="1888" max="2030" required>
            </div>

            <!-- 3. Gênero -->
            <div>
                <label for="genero">Gênero</label><br>
                <input type="text" id="genero" name="genero" required>
            </div>

            <!-- 4. Pôster -->
            <div>
                <label for="poster">URL do pôster</label><br>
                <input type="url" id="poster" name="poster">
            </div>

            <!-- 5. Status -->
            <div>
                <label for="status">Status</label><br>
                <select id="status" name="status" required>
                    <option value="quero_assistir">Quero assistir</option>
                    <option value="assistindo">Assistindo</option>
                    <option value="assistido">Assistido</option>
                </select>
            </div>

            <!-- 6. Nota -->
            <div>
                <label for="nota">Nota (1 a 5)</label><br>
                <input type="number" id="nota" name="nota" min="1" max="5">
            </div>

            <!-- 7. Comentário -->
            <div>
                <label for="comentario">Comentário</label><br>
                <textarea id="comentario" name="comentario" rows="4" cols="40"></textarea>
            </div>

            <!-- Ações -->
            <div>
                <button type="button">Cancelar</button>
                <button type="submit">Salvar</button>
            </div>

        </form>
    </main>

</body>
</html>
