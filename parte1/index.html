<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho com busca e ação -->
    <header>
        <h1>CineTrack</h1>
        <input type="search" aria-label="Buscar filme" placeholder="Buscar filme...">
        <button type="button" class="btn-adicionar">
            <span class="rotulo-curto">+</span>
            <span class="rotulo-completo">+ Adicionar</span>
        </button>
    </header>

    <!-- Barra de filtros de status -->
    <nav aria-label="Filtros de status">
        <button type="button" class="ativo" data-status="todos">Todos</button>
        <button type="button" data-status="assistido">Assistido</button>
        <button type="button" data-status="assistindo">Assistindo</button>
        <button type="button" data-status="quero">Quero assistir</button>
    </nav>

    <!-- Conteúdo principal: Catálogo de filmes -->
    <main>
        <section id="lista" aria-live="polite"></section>
    </main>

    <!-- Rodapé -->
    <footer>
        <p><a href="sobre.html">Sobre o CineTrack</a></p>
        <p>Desenvolvido por <a href="https://github.com/MatheusFrazatto">Matheus Frazatto</a></p>
        <p>Programação de Sistemas Web · UEM</p>
        <p>Professor: Lucas de Oliveira Teixeira</p>
        <p><small class="resumo-catalogo">CineTrack © 2026</small></p>
    </footer>

    <!-- Modal de cadastro (fora do fluxo, oculto até o módulo JS) -->
    <div id="modal" hidden>
        <div class="modal-conteudo">
            <h2>Adicionar filme</h2>
            <form id="form-filme" action="#" method="POST">
                <div id="erros-formulario" class="erros-formulario" role="alert" tabindex="-1" hidden></div>
                
                <div class="campo">
                    <label for="titulo"><strong>Título</strong></label>
                    <input type="text" id="titulo" name="titulo" required>
                </div>

                <div class="campo">
                    <label for="ano"><strong>Ano</strong></label>
                    <input type="number" id="ano" name="ano" min="1888" max="2030" required>
                </div>

                <div class="campo">
                    <label for="genero"><strong>Gênero</strong></label>
                    <input type="text" id="genero" name="genero" required>
                </div>

                <div class="campo">
                    <label for="poster"><strong>URL do pôster</strong></label>
                    <input type="url" id="poster" name="poster">
                </div>

                <div class="campo">
                    <label for="status"><strong>Status</strong></label>
                    <select id="status" name="status" required>
                        <option value="" disabled hidden>Selecione o status</option>
                        <option value="quero" selected>Quero assistir</option>
                        <option value="assistindo">Assistindo</option>
                        <option value="assistido">Assistido</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="nota"><strong>Nota (1 a 5)</strong></label>
                    <input type="number" id="nota" name="nota" min="1" max="5" required>
                </div>

                <div class="campo">
                    <label for="comentario"><strong>Comentário</strong></label>
                    <textarea id="comentario" name="comentario" rows="4"></textarea>
                </div>

                <div class="form-acoes">
                    <button type="button" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar</button>
                </div>

            </form>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
